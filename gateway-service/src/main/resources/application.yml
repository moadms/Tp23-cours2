server:
  port: 8888

spring:
  application:
    name: SERVICE-GATEWAY
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: SERVICE-GATEWAY
        health-check-path: /actuator/health
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
